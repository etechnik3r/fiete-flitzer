name: Deploy

on:
  push:
    branches: [main, claude/trusting-edison-3864mr]
  workflow_dispatch:

# Immer nur ein Upload gleichzeitig; weitere warten, statt sich zu stören.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versionsnummer für den Cache setzen
        run: |
          # Nur in der Arbeitskopie des Runners (nicht im Repo): Jeder Deploy
          # bekommt eine neue, aufsteigende Version aus Datum und Uhrzeit.
          # So holen die Handys die neuen Dateien, ohne dass jemand von Hand
          # zählen muss.
          N=$(date -u +%Y%m%d%H%M)
          sed -i -E "s/^var VERSION = \"v[0-9]+\";/var VERSION = \"v$N\";/; s/\?v=[0-9]+/?v=$N/g" sw.js
          sed -i -E "s/\?v=[0-9]+/?v=$N/g" index.html
          grep -n 'VERSION =' sw.js
          echo "Versionszähler: $(grep -c "?v=$N" sw.js) Stellen in sw.js, $(grep -c "?v=$N" index.html) in index.html"

      - name: Hochladen per FTPS (curl)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_ZIELPFAD: ${{ vars.FTP_ZIELPFAD }}
        run: |
          # Zielordner auf dem Server. Standard: Unterordner des Hauptzugangs.
          # Für einen auf den Ordner beschränkten FTP-Nutzer in GitHub unter
          # Settings > Secrets and variables > Actions > Variables die Variable
          # FTP_ZIELPFAD mit dem Wert "/" anlegen.
          P="${FTP_ZIELPFAD:-/fiete-flitzer.goericke.org}"
          ZIEL="ftp://$FTP_SERVER${P%/}"
          echo "Zielpfad auf dem Server: ${P}"

          # Alle Dateien des Spiels, ohne Entwicklungsdateien.
          # index.html und sw.js zuletzt, damit nie eine neue Startseite
          # mit noch fehlenden Dateien online ist.
          mapfile -t DATEIEN < <(git ls-files \
            | grep -Ev '^(\.git|\.github/|docs/|werkzeuge/|README\.md$)' \
            | grep -Evx 'index\.html|sw\.js')
          DATEIEN+=(index.html sw.js)

          ARGS=()
          for f in "${DATEIEN[@]}"; do
            ARGS+=(-T "$f" "$ZIEL/$f")
          done

          echo "Lade ${#DATEIEN[@]} Dateien hoch ..."
          curl --ssl-reqd --ftp-create-dirs --retry 3 -sS \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "${ARGS[@]}"
          echo "Fertig: ${#DATEIEN[@]} Dateien hochgeladen."
