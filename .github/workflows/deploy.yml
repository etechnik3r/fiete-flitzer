name: Deploy

on:
  push:
    branches: [claude/trusting-edison-3864mr]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lftp installieren
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Hochladen per FTPS (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set net:max-retries 3;
            set net:timeout 30;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" ftp://$FTP_SERVER;
            mirror -R --verbose --parallel=2 \
              --exclude-glob .git* \
              --exclude-glob .github \
              --exclude-glob docs \
              --exclude-glob werkzeuge \
              --exclude-glob README.md \
              ./ /fiete-flitzer.goericke.org/;
            bye
          "
