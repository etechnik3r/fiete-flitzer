name: Deploy

on:
  push:
    branches: [claude/trusting-edison-3864mr]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hochladen per FTPS (curl)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          ZIEL="ftp://$FTP_SERVER/fiete-flitzer.goericke.org"

          # Alle Dateien des Spiels, ohne Entwicklungsdateien.
          # index.html und sw.js zuletzt, damit nie eine neue Startseite
          # mit noch fehlenden Dateien online ist.
          mapfile -t DATEIEN < <(git ls-files \
            | grep -Ev '^(\.git|\.github/|docs/|werkzeuge/|README\.md$)' \
            | grep -Evx 'index\.html|sw\.js')
          DATEIEN+=(index.html sw.js)

          ARGS=()
          for f in "${DATEIEN[@]}"; do
            ARGS+=(-T "$f" "$ZIEL/$f")
          done

          echo "Lade ${#DATEIEN[@]} Dateien hoch ..."
          curl --ssl-reqd --ftp-create-dirs --retry 3 -sS \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "${ARGS[@]}"
          echo "Fertig: ${#DATEIEN[@]} Dateien hochgeladen."
