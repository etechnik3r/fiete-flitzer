name: Deploy

on:
  push:
    branches: [claude/trusting-edison-3864mr]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hochladen per FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /fiete-flitzer.goericke.org/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            docs/**
            werkzeuge/**
            README.md
