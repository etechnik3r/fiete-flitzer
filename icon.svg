<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- App-Icon von Fiete Flitzer: Fietes oranger Buggy fährt einen grünen
       Hügel hinauf, Fiete (Frosch) mit weißem Helm am Steuer.
       Als SVG gezeichnet, damit es auf jedem Handy scharf bleibt. -->
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6fd8"/>
      <stop offset="1" stop-color="#9fd0ff"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#himmel)"/>
  <circle cx="80" cy="20" r="9" fill="#ffd23f"/>
  <!-- Hügel -->
  <path d="M0 78 Q30 70 55 58 T100 44 V100 H0 Z" fill="#7a4a22"/>
  <path d="M0 78 Q30 70 55 58 T100 44" fill="none" stroke="#46b04a" stroke-width="7" stroke-linecap="round"/>
  <!-- Buggy (leicht bergauf gedreht) -->
  <g transform="translate(46 56) rotate(-17)">
    <!-- Überrollbügel -->
    <path d="M-12 -4 L-9 -19 L2 -19 L5 -6" fill="none" stroke="#3b4566" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Fiete -->
    <ellipse cx="-4" cy="-10" rx="6.4" ry="5.6" fill="#5cc65a" stroke="#2f7d3a" stroke-width="0.8"/>
    <path d="M-10 -10 A6 6 0 0 1 -3 -16 L-4 -10 Z" fill="#ffffff"/>
    <circle cx="-2.5" cy="-15" r="2.4" fill="#ffffff" stroke="#2f7d3a" stroke-width="0.5"/>
    <circle cx="0.8" cy="-14" r="2.4" fill="#ffffff" stroke="#2f7d3a" stroke-width="0.5"/>
    <circle cx="-1.8" cy="-15" r="1.1" fill="#1e2c52"/>
    <circle cx="1.5" cy="-14" r="1.1" fill="#1e2c52"/>
    <path d="M-3 -8 Q0 -5.5 2.5 -8" fill="none" stroke="#1f5a2a" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Wanne -->
    <path d="M-20 4 L16 4 Q21 3 20 -1 L16 -5 L5 -5 Q3 -5 2 -2 L-10 -2 Q-12 -2 -13 -5 L-20 -5 Z" fill="#ff9e2c" stroke="#1e2c52" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="18" cy="-0.5" r="1.3" fill="#ffe58a"/>
    <!-- Räder -->
    <circle cx="-13" cy="6" r="6.5" fill="#2b2f3a"/>
    <circle cx="-13" cy="6" r="3.4" fill="#d9deea"/>
    <circle cx="-13" cy="6" r="1.1" fill="#ffcf3a"/>
    <circle cx="13" cy="6" r="6.2" fill="#2b2f3a"/>
    <circle cx="13" cy="6" r="3.2" fill="#d9deea"/>
    <circle cx="13" cy="6" r="1.1" fill="#ffcf3a"/>
  </g>
  <!-- Münzen -->
  <circle cx="74" cy="38" r="4" fill="#f3c44a" stroke="#b9851c" stroke-width="1"/>
  <circle cx="86" cy="32" r="4" fill="#f3c44a" stroke="#b9851c" stroke-width="1"/>
</svg>
