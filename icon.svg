<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- App-Icon von Fiete Flitzer: Fietes oranger Buggy fährt einen grünen
       Hügel hinauf. Am Steuer Fiete: blonde Strubbelhaare, braune Augen,
       blauer Superhelden-Anzug mit gelbem Stern und rotem Umhang.
       Als SVG gezeichnet, damit es auf jedem Handy scharf bleibt. -->
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6fd8"/>
      <stop offset="1" stop-color="#9fd0ff"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#himmel)"/>
  <circle cx="82" cy="18" r="9" fill="#ffd23f"/>
  <!-- Hügel -->
  <path d="M0 80 Q30 72 55 60 T100 46 V100 H0 Z" fill="#7a4a22"/>
  <path d="M0 80 Q30 72 55 60 T100 46" fill="none" stroke="#46b04a" stroke-width="7" stroke-linecap="round"/>
  <!-- Buggy (leicht bergauf gedreht) -->
  <g transform="translate(47 57) rotate(-17)">
    <!-- Umhang weht nach hinten -->
    <path d="M-6 -12 Q-15 -15 -23 -11 Q-21 -8 -24 -5 Q-14 -6 -6 -8 Z" fill="#e8453c" stroke="#b8302a" stroke-width="0.6"/>
    <!-- Überrollbügel -->
    <path d="M-13 -4 L-10 -22 L2 -22 L5 -6" fill="none" stroke="#3b4566" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Anzug mit Stern -->
    <rect x="-9" y="-11" width="8" height="8" rx="2.4" fill="#2f6fd6" stroke="#1d4fa8" stroke-width="0.6"/>
    <path d="M-3.6 -8.6 l0.7 1.5 1.6 0.2 -1.2 1.1 0.3 1.6 -1.4 -0.8 -1.4 0.8 0.3 -1.6 -1.2 -1.1 1.6 -0.2 Z" fill="#ffd23f"/>
    <!-- Kopf -->
    <circle cx="-4" cy="-15" r="5.2" fill="#ffdcc4" stroke="#d99b78" stroke-width="0.6"/>
    <path d="M1 -15.4 Q2.4 -14.6 1.1 -13.6" fill="#ffdcc4" stroke="#d99b78" stroke-width="0.5"/>
    <!-- blonde Strubbelhaare -->
    <path d="M0.4 -17.6 L-0.3 -16.6 L-1.1 -17.8 L-2 -16.4 L-2.9 -17.8 L-3.8 -16.3 L-5.6 -16.4 L-7 -15.2 L-7.8 -12.4
             L-9.6 -11.6 L-10.4 -13.8 L-9.8 -15.2 L-11.4 -17.2 L-9.6 -18 L-10 -20.6 L-7.8 -19.8 L-7.2 -22.4 L-5.3 -20.6
             L-4.2 -23 L-2.9 -20.6 L-1 -22.2 L-0.6 -19.8 L1.4 -19.8 Z"
          fill="#f6d35e" stroke="#d29f2a" stroke-width="0.5" stroke-linejoin="round"/>
    <!-- braunes Auge + Lächeln -->
    <ellipse cx="-1.5" cy="-14.6" rx="1.1" ry="1.4" fill="#ffffff"/>
    <circle cx="-1.2" cy="-14.6" r="0.8" fill="#7b4a22"/>
    <circle cx="-1.1" cy="-14.6" r="0.35" fill="#2b1a0e"/>
    <path d="M-2.6 -11.9 Q-1.2 -10.7 0.2 -11.9" fill="none" stroke="#b0563f" stroke-width="0.6" stroke-linecap="round"/>
    <!-- Wanne -->
    <path d="M-21 4 L16 4 Q21 3 20 -1 L16 -5 L5 -5 Q3 -5 2 -2 L-11 -2 Q-13 -2 -14 -5 L-21 -5 Z" fill="#ff9e2c" stroke="#1e2c52" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="18" cy="-0.5" r="1.3" fill="#ffe58a"/>
    <!-- Räder -->
    <circle cx="-14" cy="6" r="6.5" fill="#2b2f3a"/>
    <circle cx="-14" cy="6" r="3.4" fill="#d9deea"/>
    <circle cx="-14" cy="6" r="1.1" fill="#ffcf3a"/>
    <circle cx="13" cy="6" r="6.2" fill="#2b2f3a"/>
    <circle cx="13" cy="6" r="3.2" fill="#d9deea"/>
    <circle cx="13" cy="6" r="1.1" fill="#ffcf3a"/>
  </g>
  <!-- Münzen -->
  <circle cx="74" cy="38" r="4" fill="#f3c44a" stroke="#b9851c" stroke-width="1"/>
  <circle cx="86" cy="33" r="4" fill="#f3c44a" stroke="#b9851c" stroke-width="1"/>
</svg>
